[package]
name = "leptos_media_player"
version.workspace = true
edition.workspace = true
description = "A Leptos media player component with playlist, fullscreen, and edit-mode reordering."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mahmoud_eltahawy/leptos_media_player"
keywords = ["leptos", "media", "video", "audio", "player"]
categories = ["gui", "web-programming", "multimedia"]
readme = "README.md"

[dependencies]
leptos = { workspace = true }
icons = { workspace = true }
leptos-use = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true , features = [
    "Document",
    "Element",
    "Event",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlVideoElement",
    "KeyboardEvent",
    "MouseEvent",
] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4", "serde", "js"] }
